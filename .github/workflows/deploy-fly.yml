name: Deploy to Fly.io

# Every push to main (a merged PR) re-renders the cards from data/cards_single/ and
# deploys https://rxindex-cards.fly.dev/. The app serves data/cards_new/, which is
# derived, so the render runs here to make sure merged edits reach the site.
# Needs repo secret FLY_API_TOKEN (app-scoped deploy token for rxindex-cards).

on:
  push:
    branches: [main]
  workflow_dispatch: {}     # manual "Run workflow" button in the Actions tab

concurrency:
  group: deploy-fly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render cards
        run: python convert_single_to_app.py

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Fail early with a readable annotation if the secret isn't reaching the job.
      # (Annotations are public; only "set/empty" and the token type are reported.)
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=FLY_API_TOKEN missing::Repository secret FLY_API_TOKEN is empty or not available to this workflow (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 1
          fi
          case "$FLY_API_TOKEN" in
            "FlyV1 "*) echo "::notice title=Fly token::FLY_API_TOKEN is set (FlyV1 token)" ;;
            *)         echo "::warning title=Fly token::FLY_API_TOKEN is set but does not start with 'FlyV1 ' - may be truncated or the wrong token type" ;;
          esac

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          if ! flyctl deploy --remote-only 2>&1 | tee deploy.log; then
            msg=$(tail -n 15 deploy.log | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=flyctl deploy failed::${msg}"
            exit 1
          fi
