name: Sync to Hugging Face Space

# GitHub is the source of truth. Every push to main (a merged PR, an agent's change)
# is mirrored to the HF Space, which rebuilds and serves it. HF is a pure deploy
# target — it always matches main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the push isn't a shallow clone

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force "https://jsilberg:${HF_TOKEN}@huggingface.co/spaces/jsilberg/fda_drug_cards" \
            HEAD:main
